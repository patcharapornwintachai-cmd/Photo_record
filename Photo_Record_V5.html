<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Record V5</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}header{background:#17365d;color:white;padding:18px}h1{margin:0}.wrap{max-width:1200px;margin:auto;padding:15px}.card{background:white;padding:18px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;display:block;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #ccd3db;border-radius:8px;font-size:16px;box-sizing:border-box}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{border:2px dashed #ccd3db;padding:8px;border-radius:9px;text-align:center}.photo img{width:100%;height:130px;object-fit:contain;background:#eee}.photo button{width:48%;padding:9px;margin-top:6px}button{border:0;border-radius:8px;padding:10px 15px;font-weight:bold;cursor:pointer}.primary{background:#17365d;color:#fff}.green{background:#198754;color:#fff}.orange{background:#e67e22;color:#fff}.red{background:#c0392b;color:#fff}.gray{background:#6c757d;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.search{width:100%}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;text-align:left}th{background:#eef2f6}.thumb img{width:50px;height:50px;object-fit:cover;margin:2px}.small{font-size:12px;color:#667085}@media(max-width:700px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script></head>
<body><header><h1>Photo Record V5</h1></header><div class="wrap">
<div class="card"><h2>บันทึกข้อมูล</h2><div class="grid">
<div><label>Code</label><input id="code"></div><div><label>Batch</label><input id="batch"></div>
<div><label>Inspecter (ผู้ตรวจสอบ)</label><input id="inspector"></div><div><label>Inspection date (วันที่ตรวจสอบ)</label><input id="date" type="date"></div></div>
<h3>📷 รูปภาพ สูงสุด 6 รูป</h3><div class="photos" id="photos"></div>
<div class="actions"><button class="primary" onclick="save()">💾 บันทึกข้อมูล</button><button class="gray" onclick="clearForm()">🧹 ล้างฟอร์ม</button></div><p id="msg"></p></div>
<div class="card"><h2>📊 Export Excel</h2><div class="grid"><div><label>Code ที่ต้องการ Export</label><input id="ec" placeholder="พิมพ์ Code"></div><div><label>Batch ที่ต้องการ Export</label><input id="eb" placeholder="พิมพ์ Batch"></div></div>
<div class="actions"><button class="green" onclick="exportFilter()">📊 Export ตาม Code / Batch</button><button class="orange" onclick="exportAll()">📦 Export Excel All</button></div>
<p class="small">ใส่ Code หรือ Batch หรือใส่ทั้งสองช่องเพื่อกรองข้อมูลได้</p></div>
<div class="card"><h2>🔎 ค้นหาข้อมูล</h2><input id="search" class="search" oninput="render()" placeholder="ค้นหา Code, Batch, Inspecter หรือวันที่"></div>
<div class="card"><h2>ข้อมูลทั้งหมด</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Code</th><th>Batch</th><th>Inspecter</th><th>Inspection date</th><th>รูป</th><th>ลบ</th></tr></thead><tbody id="body"></tbody></table></div></div>
</div>
<script>
const PASS="1166";let db,photos=Array(6).fill(null);
function initDB(){return new Promise((res,rej)=>{let r=indexedDB.open("PHOTO_RECORD_V5",1);r.onupgradeneeded=e=>{db=e.target.result;if(!db.objectStoreNames.contains("records"))db.createObjectStore("records",{keyPath:"id",autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error)})}
function getAll(){return new Promise((res,rej)=>{let r=db.transaction("records","readonly").objectStore("records").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function add(x){return new Promise((res,rej)=>{let r=db.transaction("records","readwrite").objectStore("records").add(x);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function remove(id){return new Promise((res,rej)=>{let r=db.transaction("records","readwrite").objectStore("records").delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function photoUI(){let w=document.getElementById("photos");for(let i=0;i<6;i++){w.innerHTML+=`<div class="photo"><b>รูปที่ ${i+1}</b><img id="p${i}"><button class="primary" onclick="cam(${i})">📷 ถ่ายรูป</button><button class="gray" onclick="gal(${i})">🖼️ เลือกรูป</button><input id="c${i}" type="file" accept="image/*" capture="environment" hidden onchange="pick(${i},this)"><input id="g${i}" type="file" accept="image/*" hidden onchange="pick(${i},this)"></div>`}}
function cam(i){document.getElementById("c"+i).click()}function gal(i){document.getElementById("g"+i).click()}
function pick(i,x){if(!x.files[0])return;let r=new FileReader();r.onload=()=>{photos[i]=r.result;document.getElementById("p"+i).src=r.result};r.readAsDataURL(x.files[0])}
function val(id){return document.getElementById(id).value.trim()}function msg(x){document.getElementById("msg").textContent=x}
async function save(){if(!val("code")||!val("batch")||!val("inspector")||!val("date"))return alert("กรุณากรอกข้อมูลให้ครบ");await add({code:val("code"),batch:val("batch"),inspector:val("inspector"),date:val("date"),photos:[...photos]});msg("บันทึกเรียบร้อย");clearForm();render()}
function clearForm(){["code","batch","inspector"].forEach(x=>document.getElementById(x).value="");document.getElementById("date").value=new Date().toISOString().slice(0,10);photos=Array(6).fill(null);for(let i=0;i<6;i++){document.getElementById("p"+i).src=""}}
function esc(x){return String(x||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
async function render(){let q=val("search").toLowerCase(),a=(await getAll()).filter(r=>[r.code,r.batch,r.inspector,r.date].join(" ").toLowerCase().includes(q)).sort((x,y)=>y.id-x.id),b=document.getElementById("body");b.innerHTML="";a.forEach((r,i)=>{let im=(r.photos||[]).filter(Boolean).map(x=>`<img src="${x}">`).join("");b.innerHTML+=`<tr><td>${i+1}</td><td>${esc(r.code)}</td><td>${esc(r.batch)}</td><td>${esc(r.inspector)}</td><td>${esc(r.date)}</td><td class="thumb">${im||"-"}</td><td><button class="red" onclick="del(${r.id})">🗑 ลบ</button></td></tr>`})}
async function del(id){if(prompt("รหัสผ่านสำหรับลบข้อมูล")!==PASS)return alert("รหัสผ่านไม่ถูกต้อง");if(confirm("ยืนยันการลบ?")){await remove(id);render()}}
function buf(s){let a=atob(s.split(",")[1]),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u}
async function makeExcel(rows,name){if(!rows.length)return alert("ไม่พบข้อมูล");if(typeof ExcelJS==="undefined")return alert("กรุณาเชื่อมต่ออินเทอร์เน็ตก่อน Export");let wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Photo Record");ws.columns=[{header:"ID",key:"id",width:8},{header:"Code",key:"code",width:20},{header:"Batch",key:"batch",width:20},{header:"Inspecter",key:"inspector",width:24},{header:"Inspection date",key:"date",width:20},{header:"รูป1",width:18},{header:"รูป2",width:18},{header:"รูป3",width:18},{header:"รูป4",width:18},{header:"รูป5",width:18},{header:"รูป6",width:18}];ws.getRow(1).font={bold:true};for(let r of rows){let row=ws.addRow(r);row.height=110;(r.photos||[]).forEach((p,i)=>{if(!p)return;let m=p.match(/^data:image\/([^;]+)/),e=m?m[1].toLowerCase():"png";if(e==="jpeg")e="jpg";let id=wb.addImage({buffer:buf(p),extension:e});ws.addImage(id,{tl:{col:5+i,row:row.number-1},ext:{width:120,height:90}})})}let x=await wb.xlsx.writeBuffer(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download=name;a.click()}
async function exportFilter(){let c=val("ec").toLowerCase(),b=val("eb").toLowerCase();if(!c&&!b)return exportAll();let rows=(await getAll()).filter(r=>(!c||r.code.toLowerCase().includes(c))&&(!b||r.batch.toLowerCase().includes(b)));makeExcel(rows,"Photo_Record_Filter.xlsx")}
async function exportAll(){makeExcel(await getAll(),"Photo_Record_All.xlsx")}
(async()=>{await initDB();photoUI();clearForm();render()})();
</script></body></html>
