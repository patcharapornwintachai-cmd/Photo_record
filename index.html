<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Record</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,"Noto Sans Thai",sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#17365d;color:#fff;padding:18px 24px}header h1{margin:0;font-size:25px}
.container{max-width:1200px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label{font-weight:700;display:block;margin-bottom:6px}input,textarea,button{font:inherit}
input[type=text],input[type=date],textarea{width:100%;padding:10px;border:1px solid #ccd3db;border-radius:8px}
textarea{min-height:80px;resize:vertical}
.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.photo-box{border:2px dashed #cbd3dc;border-radius:10px;padding:8px;min-height:145px;text-align:center;background:#fafbfc}
.photo-box img{width:100%;height:110px;object-fit:contain;border-radius:7px;background:#eee}
.photo-box input{width:100%;font-size:12px;margin-top:5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700}
.primary{background:#17365d;color:#fff}.green{background:#198754;color:#fff}.orange{background:#e67e22;color:#fff}.red{background:#c0392b;color:#fff}.gray{background:#6c757d;color:#fff}
.search{display:flex;gap:10px;margin-bottom:12px}.search input{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}th{background:#eef2f6}
.thumb{display:flex;gap:4px}.thumb img{width:55px;height:55px;object-fit:cover;border-radius:5px}
.small{font-size:12px;color:#667085}.status{margin-top:10px;font-weight:700}
@media(max-width:800px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}table{font-size:12px}}
</style>
<!-- ExcelJS creates a real .xlsx file and embeds the photos into the workbook. -->
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
<header><h1>Photo Record</h1></header>
<div class="container">
<div class="card">
<h2>บันทึกข้อมูล QC</h2>
<div class="grid">
<div><label>Code</label><input id="code" type="text" placeholder="ใส่ Code"></div>
<div><label>Batch</label><input id="batch" type="text" placeholder="ใส่ Batch"></div>
<div><label>ผู้ตรวจสอบ</label><input id="employee" type="text" placeholder="ชื่อผู้ตรวจสอบ"></div>
<div><label>วันที่ลงข้อมูล</label><input id="date" type="date"></div>
</div>

<h3>รูปภาพ (สูงสุด 5 รูป)</h3>
<div class="photos" id="photoInputs"></div>
<div class="actions">
<button class="primary" onclick="saveRecord()">💾 บันทึกข้อมูล</button>
<button class="green" onclick="exportExcel()">📊 Export Excel + รูป</button>
<button class="gray" onclick="clearForm()">🧹 ล้างฟอร์ม</button>
</div>
<div id="status" class="status"></div>
<p class="small">หมายเหตุ: ปุ่ม Export จะสร้างไฟล์ .xlsx จริง โดยรูปภาพจะถูกฝังอยู่ใน Excel ไม่ใช่แค่ลิงก์ไฟล์</p>
</div>

<div class="card">
<h2>ข้อมูลทั้งหมด</h2>
<div class="search"><input id="search" type="text" placeholder="ค้นหา Code, Batch, ผู้ตรวจสอบ หรือวันที่..." oninput="renderTable()"><button class="gray" onclick="renderTable()">ค้นหา</button></div>
<div style="overflow:auto"><table><thead><tr><th>#</th><th>Code</th><th>Batch</th><th>ผู้ตรวจสอบ</th><th>วันที่ลงข้อมูล</th><th>รูป</th><th>จัดการ</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
</div>

<script>
const DB_NAME='QC_PHOTO_V3_DB', STORE='records', DELETE_PASSWORD='QC2026';
let db, photos=[null,null,null,null,null];

function openDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=e=>{db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};
  req.onsuccess=e=>{db=e.target.result;resolve(db)};
  req.onerror=e=>reject(e);
 });
}
function getAll(){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readonly'), s=tx.objectStore(STORE), r=s.getAll();
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}
function addRecord(rec){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite'), r=tx.objectStore(STORE).add(rec);
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}
function deleteRecord(id){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite'), r=tx.objectStore(STORE).delete(id);
  r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);
 });
}
function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
 });
}
function makePhotoInputs(){
 const wrap=document.getElementById('photoInputs');wrap.innerHTML='';
 for(let i=0;i<5;i++){
  const box=document.createElement('div');box.className='photo-box';
  box.innerHTML=`<div><b>รูปที่ ${i+1}</b></div><img id="preview${i}" src="" alt=""><input type="file" accept="image/*" capture="environment" onchange="choosePhoto(${i},this)">`;
  wrap.appendChild(box);
 }
}
async function choosePhoto(i,input){
 const f=input.files[0]; if(!f)return;
 photos[i]=await fileToDataURL(f);
 document.getElementById('preview'+i).src=photos[i];
}
function val(id){return document.getElementById(id).value.trim()}
async function saveRecord(){
 if(!val('code')){alert('กรุณาใส่ Code / Batch');return}
 const rec={code:val('code'),batch:val('batch'),employee:val('employee'),date:document.getElementById('date').value,
 photos:[...photos],createdAt:new Date().toISOString()};
 await addRecord(rec);setStatus('บันทึกข้อมูลเรียบร้อยแล้ว');
 clearForm();renderTable();
}
function setStatus(t){document.getElementById('status').textContent=t;setTimeout(()=>document.getElementById('status').textContent='',3000)}
function clearForm(){
 ['code','batch','employee'].forEach(x=>document.getElementById(x).value='');
 document.getElementById('date').value=new Date().toISOString().slice(0,10);
 photos=[null,null,null,null,null];
 for(let i=0;i<5;i++)document.getElementById('preview'+i).src='';
 document.querySelectorAll('.photo-box input[type=file]').forEach(x=>x.value='');
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function renderTable(){
 const all=await getAll(), q=document.getElementById('search').value.toLowerCase();
 const rows=all.filter(r=>[r.code,r.batch,r.employee,r.date].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);
 const tb=document.getElementById('tbody');tb.innerHTML='';
 rows.forEach((r,n)=>{
  const tr=document.createElement('tr');
  const imgs=r.photos.filter(Boolean).map(x=>`<img src="${x}">`).join('');
  tr.innerHTML=`<td>${n+1}</td><td>${esc(r.code)}</td><td>${esc(r.batch)}</td><td>${esc(r.employee)}</td><td>${esc(r.date)}</td><td><div class="thumb">${imgs||'-'}</div></td><td><button class="red" onclick="protectedDelete(${r.id})">🗑 ลบ</button></td>`;
  tb.appendChild(tr);
 });
}
async function protectedDelete(id){
 const p=prompt('การลบข้อมูลต้องใส่รหัสผ่าน:');
 if(p===null)return;
 if(p!==DELETE_PASSWORD){alert('รหัสผ่านไม่ถูกต้อง');return}
 if(confirm('ยืนยันการลบข้อมูลรายการนี้?')){await deleteRecord(id);renderTable();setStatus('ลบข้อมูลแล้ว')}
}
function base64ToBuffer(dataURL){
 const b64=dataURL.split(',')[1];const bin=atob(b64);const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes;
}
async function exportExcel(){
 const all=await getAll();
 if(!all.length){alert('ยังไม่มีข้อมูลสำหรับ Export');return}
 if(typeof ExcelJS==='undefined'){alert('ไม่สามารถโหลด ExcelJS ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');return}
 const wb=new ExcelJS.Workbook();
 wb.creator='Photo Record';wb.created=new Date();
 const ws=wb.addWorksheet('QC Data');
 ws.columns=[
  {header:'ID',key:'id',width:8},{header:'Code / Batch',key:'code',width:20},{header:'Employee',key:'employee',width:22},
  {header:'วันที่',key:'date',width:14},{header:'รายละเอียด',key:'title',width:28},{header:'หมายเหตุ',key:'note',width:35},
  {header:'รูปที่ 1',key:'p1',width:18},{header:'รูปที่ 2',key:'p2',width:18},{header:'รูปที่ 3',key:'p3',width:18},
  {header:'รูปที่ 4',key:'p4',width:18},{header:'รูปที่ 5',key:'p5',width:18}
 ];
 ws.getRow(1).font={bold:true};ws.getRow(1).alignment={vertical:'middle',horizontal:'center',wrapText:true};ws.getRow(1).height=28;
 for(const r of all){
  const row=ws.addRow({id:r.id,code:r.code,batch:r.batch,employee:r.employee,date:r.date});
  row.height=100;row.alignment={vertical:'top',wrapText:true};
  r.photos.forEach((p,i)=>{
   if(!p)return;
   let ext='png';const m=p.match(/^data:image\/([^;]+);/);if(m){ext=m[1].toLowerCase();if(ext==='jpeg')ext='jpg';}
   const imageId=wb.addImage({buffer:base64ToBuffer(p),extension:ext});
   ws.addImage(imageId,{tl:{col:5+i,row:row.number-1},ext:{width:120,height:90}});
  });
 }
 ws.views=[{state:'frozen',ySplit:1}];
 const buf=await wb.xlsx.writeBuffer();
 const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='QC_Photo_Record_V3_'+new Date().toISOString().slice(0,10)+'.xlsx';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);setStatus('Export Excel + รูปเรียบร้อยแล้ว');
}
(async()=>{await openDB();makePhotoInputs();clearForm();renderTable()})();
</script>
</body>
</html>
